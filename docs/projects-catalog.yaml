  - id: otelforge
    name: OtelForge
    github_url: https://github.com/SK-ILLish-GIT/OtelForge
    github_access: public
    github_fetched: "2026-08-25"
    dates: 02/2025 -- Present

    summary: >
      Cloud-agnostic internal platform to deploy and operate OpenTelemetry Collector
      configurations across SSH-reachable Linux nodes (AWS EC2, GCP, Azure, on-prem).
      Operators register instances, launch batch events against one or many targets, and
      watch live job output in a React UI. Go (Fiber) REST API, async Go workers via
      RabbitMQ, PostgreSQL persistence, Docker Compose deployment. SSH + SCP execution
      with predefined audited scripts, pre/post verification, rollback, and per-event audit trail.

    stack:
      - OpenTelemetry
      - Go
      - Golang
      - Fiber
      - React
      - TypeScript
      - Vite
      - PostgreSQL 16
      - RabbitMQ 3
      - Docker Compose
      - SSH
      - SCP
      - JWT
      - bcrypt
      - AES-256-GCM

    services:
      - Go REST API (Fiber) — /api/v1
      - Go worker pool — RabbitMQ consumer + SSH runner
      - React + Vite web UI — live event polling, job logs
      - PostgreSQL 16 — users, instances, events, jobs
      - RabbitMQ 3 — async job queue with DLQ

    highlights:
      - Batch deploy OTel Collector configs to N nodes via one event (SSH + SCP, no agent required)
      - Async job processing — API enqueues one RabbitMQ message per node; workers execute remotely
      - Live job output in UI with 1.5s polling; per-node pass/fail, stdout/stderr, rollback
      - Pre-run YAML validation and post-run verification checks on every deploy
      - Security — JWT auth, AES-256-GCM encrypted SSH credentials, SSH host-key TOFU pinning
      - Audit trail — launcher name/email on every event; admin views across all activity
      - Predefined platform-owned bash scripts only (no arbitrary user shell)
      - Cloud-agnostic — works on any SSH-reachable Linux node, not AWS IAM/SSM dependent
      - Docker Compose stack — postgres, rabbitmq, api, worker, web
      - Retries with DLQ after 3 failed attempts; rerun-failed and per-node rollback APIs
      - Related to production OtelForge work at Zscaler (20+ AWS EC2 instances)

    predefined_tasks:
      - Deploy collector config
      - Validate config (otelcol validate)
      - Restart collector service
      - Rollback to backup
      - Fetch collector logs
      - Install OTel Agent

