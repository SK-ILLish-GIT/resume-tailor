    summary: >
      CLI file organization toolkit — Bash script classifies files by extension into images,
      videos, docs, archives, and music. Smart subfolders for screenshots/PDFs, duplicate-name
      skipping. Python wrapper installs script, prompts for categories, prints move summary
      with throughput stats.

    stack:
      - Bash
      - Python 3
      - Shell Scripting

    highlights:
      - Extension-based file sorting into 5 category folders
      - Smart subfolders — Screenshots → Images/Screenshots, PDFs → Docs/PDFs
      - Duplicate handling — skips if target filename already exists
      - Python CLI wrapper with category prompts and summary report (files moved, time, throughput)
      - Customizable categories via flags (--images, --videos, --docs, --archives, --music)

