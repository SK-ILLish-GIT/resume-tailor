# Project catalog for /tailor-resume project selection.
# Fetched from GitHub READMEs/docs where public; updated manually when repos are private.
# Match projects to JD keywords using role_focus, jd_keywords, and best_for_jd_types.
# Always include exactly 2 projects — pick highest-scoring pair from this catalog.

meta:
  last_updated: "2026-08-25"
  selection_rule: >
    GameVault is ALWAYS project #1 (include: true, listed first among projects).
    Pick the 2nd project by JD keyword overlap from OtelForge, File Organizer, PriceTracker.
    Always exactly 2 projects included.

projects:
  - id: gamevault
    name: GameVault (Distributed Gaming Platform)
    github_url: https://github.com/SK-ILLish-GIT/games_sk
    github_access: public
    dates: 01/2026 -- 04/2026

    summary: >
      Production-grade microservices gaming platform — 10-service Docker Compose stack plus
      optional 8-container observability overlay. Nginx API gateway, 5 Express.js backend
      services, JWT auth, Redis leaderboards, PostgreSQL + MongoDB + Redis data layer,
      full MELT observability (OpenTelemetry, Prometheus, Grafana, Loki, Tempo).

    stack:
      - TypeScript
      - React 18
      - Vite
      - Node.js
      - Express.js
      - Nginx
      - Docker Compose
      - PostgreSQL 16
      - MongoDB 7
      - Redis 7
      - OpenTelemetry
      - Prometheus
      - Grafana
      - Loki
      - Tempo
      - Prisma
      - JWT

    services_count: 10
    observability_containers: 8
    grafana_dashboards: 6

    highlights:
      - Microservices architecture with independent Docker containers per game/service
      - Nginx API gateway routing to auth, leaderboard, and 5 game backend services
      - JWT auth with rotated refresh tokens; Redis sorted-set leaderboards
      - Three data stores — PostgreSQL (users/auth), MongoDB (game state), Redis (cache/sessions)
      - Full observability stack — OTel SDK in every service, 6 Grafana dashboards, trace-log correlation
      - Flappy Bird with HMAC-signed run validation; six game modes

    role_focus:
      - backend
      - platform
      - infra
      - observability
      - distributed-systems
      - microservices
      - cloud-native
      - fullstack

